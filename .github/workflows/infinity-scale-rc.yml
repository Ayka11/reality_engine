name: Infinity Scale RC Validation

on:
  workflow_dispatch:
  push:
    branches:
      - infinity-scale-real-diagnostics
  pull_request:
    branches:
      - infinity-scale-real-diagnostics

permissions:
  contents: read

# Release-candidate gate for the real Infinity Scale diagnostics branch.

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript validation
        run: npx tsc --noEmit

      - name: Production build
        run: npm run build

      - name: Infinity Scale release validation
        run: npx --yes tsx scripts/validate-infinity-scale.ts

      - name: Release evidence validation
        run: npm run validate:infinity-scale:evidence

      - name: Reproducible RC package check
        run: npm run package:infinity-scale:rc

      - name: Release provenance integrity
        run: npm run validate:infinity-scale:integrity
