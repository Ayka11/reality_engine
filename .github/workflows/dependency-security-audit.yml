name: Dependency Security Audit

on:
  push:
    branches:
      - codex/dependency-audit-report-2026-10-17
  workflow_dispatch:
  pull_request:
    branches:
      - infinity-scale-real-diagnostics
    paths:
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/dependency-security-audit.yml"

permissions:
  contents: read

jobs:
  audit:
    name: npm dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Generate full JSON audit report
        id: audit
        shell: bash
        run: |
          set +e
          npm audit --json > npm-audit.json
          audit_exit_code=$?
          set -e

          node --input-type=commonjs <<'NODE'
          const fs = require('node:fs');

          let report;
          try {
            report = JSON.parse(fs.readFileSync('npm-audit.json', 'utf8'));
          } catch (error) {
            const summary = {
              reportValid: false,
              error: 'npm audit did not produce valid JSON',
              detail: String(error),
            };
            fs.writeFileSync('npm-audit-summary.json', JSON.stringify(summary, null, 2) + '\n');
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, '## Dependency security audit\n\n**ERROR:** npm audit did not produce valid JSON. See the uploaded artifact and job logs.\n');
            process.exit(0);
          }

          const vulnerabilities = report.metadata?.vulnerabilities ?? {};
          const total = Number(vulnerabilities.total ?? 0);
          const entries = Object.entries(report.vulnerabilities ?? {}).map(([name, item]) => ({
            name,
            severity: item.severity,
            isDirect: item.isDirect,
            range: item.range,
            fixAvailable: item.fixAvailable,
            via: (item.via ?? []).map(v => typeof v === 'string' ? v : {
              title: v.title,
              url: v.url,
              range: v.range,
              severity: v.severity,
            }),
          }));

          const summary = {
            reportValid: true,
            auditReportVersion: report.auditReportVersion ?? null,
            vulnerabilities: {
              info: Number(vulnerabilities.info ?? 0),
              low: Number(vulnerabilities.low ?? 0),
              moderate: Number(vulnerabilities.moderate ?? 0),
              high: Number(vulnerabilities.high ?? 0),
              critical: Number(vulnerabilities.critical ?? 0),
              total,
            },
            packages: report.metadata?.dependencies ?? null,
            packagesWithFindings: entries,
            auditError: report.error ?? null,
          };

          fs.writeFileSync('npm-audit-summary.json', JSON.stringify(summary, null, 2) + '\n');
          const lines = [
            '## Dependency security audit',
            '',
            '| Severity | Count |',
            '|---|---:|',
            '| Critical | ' + summary.vulnerabilities.critical + ' |',
            '| High | ' + summary.vulnerabilities.high + ' |',
            '| Moderate | ' + summary.vulnerabilities.moderate + ' |',
            '| Low | ' + summary.vulnerabilities.low + ' |',
            '| Info | ' + summary.vulnerabilities.info + ' |',
            '| **Total** | **' + total + ' |',
            '',
            'Full package-level details are attached as the `npm-audit-report` workflow artifact.',
          ];
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join('\n') + '\n');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, 'total=' + total + '\n');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, 'report_valid=true\n');
          console.log(JSON.stringify(summary, null, 2));
          NODE

          echo "npm_exit_code=$audit_exit_code" >> "$GITHUB_OUTPUT"

      - name: Prepare semver-compatible lockfile fix candidate
        id: safe_fix
        shell: bash
        run: |
          set +e
          npm audit fix --package-lock-only --ignore-scripts > npm-audit-fix.log 2>&1
          fix_exit_code=$?
          set -e
          echo "npm audit fix exit code: $fix_exit_code"
          cat npm-audit-fix.log

          set +e
          npm audit --json > npm-audit-after-safe-fix.json
          audit_exit_code=$?
          set -e
          echo "post_fix_audit_exit_code=$audit_exit_code" >> "$GITHUB_OUTPUT"

          node --input-type=commonjs <<'NODE'
          const fs = require('node:fs');
          let report;
          try {
            report = JSON.parse(fs.readFileSync('npm-audit-after-safe-fix.json', 'utf8'));
          } catch (error) {
            fs.writeFileSync('npm-audit-after-safe-fix-summary.json', JSON.stringify({
              reportValid: false,
              error: String(error),
            }, null, 2) + '\n');
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, '\n**Safe-fix candidate audit:** report could not be parsed; inspect artifacts.\n');
            process.exit(0);
          }
          const v = report.metadata?.vulnerabilities ?? {};
          const summary = {
            reportValid: true,
            vulnerabilities: {
              info: Number(v.info ?? 0),
              low: Number(v.low ?? 0),
              moderate: Number(v.moderate ?? 0),
              high: Number(v.high ?? 0),
              critical: Number(v.critical ?? 0),
              total: Number(v.total ?? 0),
            },
            packagesWithFindings: Object.entries(report.vulnerabilities ?? {}).map(([name, item]) => ({
              name,
              severity: item.severity,
              range: item.range,
              fixAvailable: item.fixAvailable,
              via: (item.via ?? []).map(v => typeof v === 'string' ? v : {
                title: v.title, url: v.url, range: v.range, severity: v.severity,
              }),
            })),
            auditError: report.error ?? null,
          };
          fs.writeFileSync('npm-audit-after-safe-fix-summary.json', JSON.stringify(summary, null, 2) + '\n');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, 'total=' + summary.vulnerabilities.total + '\n');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, 'report_valid=' + String(summary.reportValid) + '\n');
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, [
            '',
            '### Semver-compatible fix candidate (lockfile only)',
            '',
            '| Severity | Remaining |',
            '|---|---:|',
            '| Critical | ' + summary.vulnerabilities.critical + ' |',
            '| High | ' + summary.vulnerabilities.high + ' |',
            '| Moderate | ' + summary.vulnerabilities.moderate + ' |',
            '| Low | ' + summary.vulnerabilities.low + ' |',
            '| Info | ' + summary.vulnerabilities.info + ' |',
            '| **Total** | **' + summary.vulnerabilities.total + ' |',
            '',
            'This is a generated candidate only. No repository manifest or lockfile was committed.',
          ].join('\n') + '\n');
          console.log(JSON.stringify(summary, null, 2));
          NODE

          git diff -- package-lock.json > package-lock-safe-fix.diff
          echo "lockfile_changed=$(git diff --quiet -- package-lock.json; echo $?)" >> "$GITHUB_OUTPUT"

      - name: Install semver-compatible candidate
        run: npm ci

      - name: Validate candidate production build
        run: npm run build

      - name: Upload full audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-report
          path: |
            npm-audit.json
            npm-audit-summary.json
            npm-audit-fix.log
            npm-audit-after-safe-fix.json
            npm-audit-after-safe-fix-summary.json
            package-lock.json
            package-lock-safe-fix.diff
          if-no-files-found: error
          retention-days: 14

      - name: Enforce safe-fix candidate audit result
        if: always()
        shell: bash
        run: |
          node --input-type=commonjs <<'NODE'
          const fs = require('node:fs');
          let report;
          try {
            report = JSON.parse(fs.readFileSync('npm-audit-after-safe-fix-summary.json', 'utf8'));
          } catch (error) {
            console.error('Missing or invalid post-fix audit summary:', String(error));
            process.exit(2);
          }
          if (!report.reportValid) {
            console.error('Post-fix npm audit report is invalid.');
            process.exit(2);
          }
          const total = Number(report.vulnerabilities?.total ?? 0);
          console.log('Remaining vulnerable package entries after semver-compatible fixes:', total);
          if (total > 0) {
            console.error('The candidate still has ' + total + ' vulnerable package entries. Review the artifact and assess required major upgrades separately.');
            process.exit(1);
          }
          NODE
