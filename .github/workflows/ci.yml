name: Reality Engine CI

on:
  push:
    branches: [main, reality-engine-hf-infinity]
  pull_request:
    branches: [main, reality-engine-hf-infinity]

concurrency:
  group: reality-engine-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --package-lock-only --ignore-scripts
      - run: npm ci
      - run: npm run lint
      - run: npm run test:brushes --if-present
      - run: npm run test:world-field --if-present
      - run: npm run test:presets --if-present
      - run: npm run test:preset-field --if-present
      - run: npm run build
      - run: npm run hf:smoke
      - run: npm run hf:cpu:check
      - run: npx playwright install chromium
      - run: timeout 180s npm run hf:browser:acceptance
