<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reality Engine v5 — Creator Engine</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.10.0/tabler-icons.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#09090f;--panel:#111119;--border:#252535;--accent:#7c6fcd;--text:#d0cef5;--sub:#666;--success:#3db872;--warn:#e09030;--danger:#e04848;--info:#5080e0}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:system-ui,sans-serif;font-size:12px}
#app{display:grid;grid-template-columns:52px 200px 1fr 220px;grid-template-rows:42px 1fr 30px;height:100vh;border:0.5px solid var(--border);overflow:hidden}
/* TOP BAR */
#topbar{grid-column:1/-1;display:flex;align-items:center;gap:6px;padding:0 10px;background:var(--panel);border-bottom:0.5px solid var(--border)}
.mode-btn{font-size:10px;padding:3px 10px;border:0.5px solid var(--border);border-radius:20px;cursor:pointer;background:transparent;color:var(--sub);white-space:nowrap;transition:all .15s}
.mode-btn.active{border-color:var(--accent);color:#a09af0;background:#1a1830}
.tbsep{width:0.5px;height:18px;background:var(--border);margin:0 2px;flex-shrink:0}
.compose-btn{padding:3px 14px;border:0.5px solid var(--accent);border-radius:20px;cursor:pointer;background:#1a1830;color:#a09af0;font-size:10px;font-weight:500}
/* ICON SIDEBAR */
#icons{background:var(--panel);border-right:0.5px solid var(--border);display:flex;flex-direction:column;align-items:center;padding:8px 0;gap:4px}
.icon-btn{width:36px;height:36px;border:0.5px solid transparent;border-radius:8px;cursor:pointer;background:transparent;color:var(--sub);font-size:16px;display:flex;align-items:center;justify-content:center;transition:all .15s;position:relative}
.icon-btn:hover{background:#1a1a28;border-color:var(--border);color:var(--text)}
.icon-btn.active{background:#1a1830;border-color:var(--accent);color:#a09af0}
.icon-tip{position:absolute;left:44px;background:#1a1a28;border:0.5px solid var(--border);border-radius:5px;padding:3px 7px;font-size:9px;color:var(--text);white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .15s;z-index:20}
.icon-btn:hover .icon-tip{opacity:1}
/* LEFT PANEL */
#left{background:var(--panel);border-right:0.5px solid var(--border);overflow-y:auto;display:flex;flex-direction:column;gap:0}
.section{border-bottom:0.5px solid var(--border)}
.section-hdr{display:flex;align-items:center;justify-content:space-between;padding:7px 10px 7px;cursor:pointer;user-select:none}
.section-hdr span{font-size:9px;color:var(--sub);letter-spacing:.06em;text-transform:uppercase}
.section-hdr .arrow{font-size:9px;color:var(--sub);transition:transform .2s}
.section-body{padding:8px 10px}
.section.collapsed .section-body{display:none}
.section.collapsed .arrow{transform:rotate(-90deg)}
/* Controls */
.ctrl-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.ctrl-label{font-size:10px;color:var(--sub);flex:1}
.ctrl-val{font-size:10px;font-family:monospace;color:var(--text);min-width:32px;text-align:right}
input[type=range]{width:80px;accent-color:var(--accent);height:3px}
.pill-row{display:flex;gap:3px;flex-wrap:wrap;margin-bottom:6px}
.pill{font-size:9px;padding:2px 7px;border-radius:20px;cursor:pointer;border:0.5px solid var(--border);color:var(--sub);transition:all .15s}
.pill:hover{border-color:var(--accent);color:var(--text)}
.pill.on{border-color:var(--accent);color:#a09af0;background:#1a1830}
/* Law rows */
.law-row{display:flex;align-items:center;gap:6px;margin-bottom:5px;padding:4px 6px;border-radius:5px;background:#0e0e18;border:0.5px solid var(--border)}
.law-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.law-name{font-size:9px;color:var(--sub);flex:1}
.law-fit{font-size:9px;font-family:monospace;min-width:28px;text-align:right}
.law-toggle{width:18px;height:10px;border-radius:5px;cursor:pointer;border:none;flex-shrink:0;transition:background .15s}
/* CANVAS */
#cw{position:relative;overflow:hidden;display:flex;flex-direction:column}
#viewWrap{flex:1;position:relative;overflow:hidden;background:#07070e;cursor:crosshair}
#gc{display:block;width:100%;height:100%}
.ctab{padding:5px 14px;font-size:9px;cursor:pointer;border-bottom:2px solid transparent;color:var(--sub);flex-shrink:0;user-select:none;transition:all .15s}
.ctab.on{color:#a09af0;border-bottom-color:var(--accent);background:#1a1830}
.cbtn1{padding:3px 10px;border:0.5px solid var(--border);border-radius:5px;cursor:pointer;background:#0e0e18;color:var(--sub);font-size:9px;transition:all .15s}
.cbtn1:hover{border-color:var(--accent);color:#a09af0}
/* RIGHT PANEL */
#right{background:var(--panel);border-left:0.5px solid var(--border);overflow-y:auto;display:flex;flex-direction:column}
.rpanel{padding:8px 10px;border-bottom:0.5px solid var(--border)}
.rl{font-size:9px;color:var(--sub);letter-spacing:.06em;text-transform:uppercase;margin-bottom:6px;display:block}
/* Health bars */
.hbar{margin-bottom:5px}
.hbar-hdr{display:flex;justify-content:space-between;font-size:9px;margin-bottom:2px}
.hbar-hdr span:first-child{color:var(--sub)}
.hbar-track{height:4px;border-radius:2px;background:#1a1a22;overflow:hidden}
.hbar-fill{height:100%;border-radius:2px;transition:width .4s}
/* Semantic tags */
.sem-tags{display:flex;gap:4px;flex-wrap:wrap}
.sem-tag{font-size:9px;padding:2px 8px;border-radius:12px;border:0.5px solid}
/* Alerts */
.alert{font-size:9px;padding:3px 7px;border-radius:4px;margin-bottom:3px;border-left:2px solid}
.alert-critical{background:#20080822;color:#e06060;border-color:var(--danger)}
.alert-warn{background:#20140822;color:#d08040;border-color:var(--warn)}
.alert-ok{background:#08200822;color:#50d080;border-color:var(--success)}
.alert-info{background:#08102022;color:#6090e0;border-color:var(--info)}
/* Explainer cards */
.excard{padding:6px 8px;background:#0e0e18;border-radius:6px;border:0.5px solid var(--border);margin-bottom:5px}
.excard-hdr{display:flex;justify-content:space-between;margin-bottom:3px}
.excard-field{font-size:10px;color:#999}
.excard-val{font-size:10px;font-family:monospace;color:var(--text)}
.excard-why{font-size:9px;color:var(--sub);line-height:1.55}
/* History graph */
#hc{width:100%;height:70px;border-radius:5px;border:0.5px solid var(--border);background:#07070e;display:block}
/* BOTTOM BAR */
#bot{grid-column:1/-1;display:flex;align-items:center;gap:8px;padding:0 10px;background:var(--panel);border-top:0.5px solid var(--border);font-size:10px}
#pb{padding:2px 12px;border:0.5px solid #3a3a5a;border-radius:5px;cursor:pointer;background:transparent;font-size:10px;color:var(--text)}
.bst{color:var(--sub)}.bsv{font-weight:500;color:var(--text);font-family:monospace}
input[type=range]#spd{width:55px}
/* COMPOSER MODAL */
#comp{display:none;position:absolute;inset:0;background:rgba(7,7,14,.96);z-index:50;align-items:center;justify-content:center}
#comp.open{display:flex}
.comp-box{background:var(--panel);border:0.5px solid var(--border);border-radius:12px;width:min(680px,94%);max-height:88%;display:flex;flex-direction:column}
.comp-hdr{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:0.5px solid var(--border)}
.comp-title{font-size:15px;font-weight:500}
.comp-sub{font-size:10px;color:var(--sub);margin-top:2px}
.comp-steps{display:flex;border-bottom:0.5px solid var(--border)}
.comp-step{flex:1;padding:8px 4px;text-align:center;font-size:9px;cursor:pointer;border-bottom:2px solid transparent;color:var(--sub);transition:all .15s}
.comp-step.active{color:#a09af0;border-color:var(--accent);background:#1a1830}
.comp-step.done{color:var(--success)}
.comp-body{flex:1;overflow-y:auto;padding:16px 18px}
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.wcard{padding:10px;border-radius:8px;cursor:pointer;border:0.5px solid var(--border);background:#0e0e18;transition:all .15s}
.wcard:hover{border-color:#3a3a55;background:#111122}
.wcard.sel{border-color:var(--accent);background:#1a1830}
.wcard-icon{font-size:20px;margin-bottom:5px}
.wcard-name{font-size:11px;font-weight:500;color:#b0a8f0;margin-bottom:3px}
.wcard-desc{font-size:9px;color:var(--sub);line-height:1.5}
.comp-footer{display:flex;justify-content:space-between;align-items:center;padding:10px 18px;border-top:0.5px solid var(--border);background:#0d0d14;border-radius:0 0 12px 12px}
.comp-sel-display{font-size:9px;color:var(--sub);font-family:monospace;max-width:360px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cb1{padding:4px 14px;border:0.5px solid var(--border);border-radius:6px;cursor:pointer;background:transparent;color:var(--sub);font-size:10px}
.cb2{padding:4px 16px;border:0.5px solid var(--accent);border-radius:6px;cursor:pointer;background:#1a1830;color:#a09af0;font-size:10px;font-weight:500}
/* brush selector */
.brush-grid{display:grid;grid-template-columns:1fr 1fr;gap:3px}
.brush-btn{font-size:9px;padding:4px 5px;border:0.5px solid var(--border);border-radius:5px;cursor:pointer;background:#0e0e18;color:var(--sub);text-align:left;transition:all .15s}
.brush-btn:hover{border-color:var(--accent);color:var(--text)}
.brush-btn.active{border-color:var(--accent);color:#a09af0;background:#1a1830}
/* Plog */
#plog{position:absolute;top:6px;left:50%;transform:translateX(-50%);background:rgba(17,17,25,.92);border:0.5px solid var(--border);border-radius:6px;padding:3px 10px;font-size:9px;color:#888;pointer-events:none;white-space:nowrap;z-index:10;font-family:monospace}
</style>
</head>
<body>
<div id="app" style="position:relative">

<!-- TOP BAR -->
<div id="topbar">
  <button class="compose-btn" onclick="openComposer()">✦ Compose World</button>
  <div class="tbsep"></div>
  <button class="mode-btn active" data-mode="create">Create</button>
  <button class="mode-btn" data-mode="science">Science</button>
  <button class="mode-btn" data-mode="cinema">Cinema</button>
  <button class="mode-btn" data-mode="game">Game Dev</button>
  <div class="tbsep"></div>
  <button class="mode-btn" id="layerE" onclick="setLayer(0)">Energy</button>
  <button class="mode-btn" id="layerD" onclick="setLayer(1)">Density</button>
  <button class="mode-btn" id="layerI" onclick="setLayer(2)">Info</button>
  <button class="mode-btn" id="layerS" onclick="setLayer(3)">Entropy</button>
  <button class="mode-btn" id="layerT" onclick="setLayer(4)">Temp</button>
  <button class="mode-btn" id="layerB" onclick="setLayer(5)">Bio</button>
  <div style="flex:1"></div>
  <span style="font-size:9px;color:var(--sub)">FPS:</span><span id="fpsOut" style="font-family:monospace;color:var(--text);min-width:20px">0</span>
</div>

<!-- ICON SIDEBAR -->
<div id="icons">
  <button class="icon-btn active" data-panel="world" onclick="setIconPanel('world')" title="World"><i class="ti ti-planet"></i><span class="icon-tip">World</span></button>
  <button class="icon-btn" data-panel="laws" onclick="setIconPanel('laws')" title="Laws"><i class="ti ti-atom"></i><span class="icon-tip">Laws</span></button>
  <button class="icon-btn" data-panel="brush" onclick="setIconPanel('brush')" title="Brushes"><i class="ti ti-brush"></i><span class="icon-tip">Brushes</span></button>
  <button class="icon-btn" data-panel="agents" onclick="setIconPanel('agents')" title="Agents"><i class="ti ti-robot"></i><span class="icon-tip">Agents</span></button>
  <button class="icon-btn" data-panel="script" onclick="setIconPanel('script')" title="Script"><i class="ti ti-code"></i><span class="icon-tip">Script</span></button>
  <div style="flex:1"></div>
  <button class="icon-btn" onclick="saveWorld()" title="Save"><i class="ti ti-download"></i><span class="icon-tip">Save</span></button>
</div>

<!-- LEFT PANEL (context-sensitive) -->
<div id="left"></div>

<!-- CENTER CANVAS -->
<div id="cw">
  <div id="tabs" style="display:flex;background:var(--panel);border-bottom:0.5px solid var(--border);flex-shrink:0">
    <div class="ctab on" id="tab3d" onclick="setRenderMode('3d',this)">🔲 3D Volumetric</div>
    <div class="ctab" id="tab2d" onclick="setRenderMode('2d',this)">⬛ 2D Multi-Slice</div>
    <div class="ctab" id="tabHybrid" onclick="setRenderMode('hybrid',this)">⟐ Hybrid</div>
    <div class="ctab" id="tabMetrics" onclick="setRenderMode('metrics',this)">📈 Metrics</div>
  </div>
  <div id="viewWrap">
  <canvas id="gc"></canvas>
  <div id="metricsView" style="display:none;position:absolute;inset:0;background:#07070e;padding:14px;overflow-y:auto;font-size:10px;font-family:monospace;color:var(--sub)">
    <div style="font-size:12px;color:var(--text);margin-bottom:10px;font-family:system-ui">📈 World Metrics</div>
    <div id="metricsContent"></div>
  </div>
  <div id="plog">ready</div>

  <!-- COMPOSER MODAL -->
  <div id="comp">
    <div class="comp-box">
      <div class="comp-hdr">
        <div><div class="comp-title">World Composer</div><div class="comp-sub">Design your universe in 5 steps</div></div>
        <button onclick="closeComposer()" style="background:none;border:none;color:var(--sub);font-size:18px;cursor:pointer">✕</button>
      </div>
      <div class="comp-steps" id="compSteps"></div>
      <div class="comp-body" id="compBody"></div>
      <div style="padding:10px 18px;border-top:0.5px solid var(--border);background:#0d0d16">
        <div style="font-size:9px;color:var(--sub);margin-bottom:6px">Preview Render Mode</div>
        <div style="display:flex;gap:6px">
          <button onclick="previewRenderMode('3d')" class="cbtn1">🔲 3D Volumetric</button>
          <button onclick="previewRenderMode('2d')" class="cbtn1">⬛ 2D Multi-Slice</button>
          <button onclick="previewRenderMode('hybrid')" class="cbtn1">⟐ Hybrid</button>
        </div>
      </div>
      <div class="comp-footer">
        <button class="cb1" id="compBack">← Back</button>
        <div class="comp-sel-display" id="compSel"></div>
        <button class="cb2" id="compNext">Next →</button>
      </div>
    </div>
  </div>
  </div><!-- /viewWrap -->
</div>

<!-- RIGHT PANEL -->
<div id="right">
  <div class="rpanel">
    <span class="rl">World Health</span>
    <div id="hbars"></div>
    <div class="sem-tags" id="semTags" style="margin-top:6px"></div>
    <div id="alerts" style="margin-top:6px"></div>
  </div>
  <div class="rpanel">
    <span class="rl">Cell Inspector</span>
    <div id="inspector"><div style="font-size:9px;color:var(--sub)">Click a cell to explain it</div></div>
  </div>
  <div class="rpanel">
    <span class="rl">History</span>
    <canvas id="hc" width="200" height="70"></canvas>
    <div style="display:flex;gap:5px;margin-top:4px;font-size:9px">
      <span style="color:#6080ff">E</span><span style="color:#ef8030">T</span>
      <span style="color:#a060e0">I</span><span style="color:#e04040">S</span>
      <span style="color:#30a060">B</span>
    </div>
  </div>
</div>

<!-- BOTTOM BAR -->
<div id="bot">
  <button id="pb" onclick="togglePlay()">▶ Play</button>
  <input type="range" id="spd" min="1" max="20" value="4" step="1" oninput="document.getElementById('spdOut').textContent=this.value+'x'">
  <span class="bst">Speed:</span><span class="bsv" id="spdOut">4x</span>
  <div class="tbsep"></div>
  <span class="bst">Tick:</span><span class="bsv" id="tkOut">0</span>
  <span class="bst" style="margin-left:6px">Energy:</span><span class="bsv" id="eOut">0</span>
  <span class="bst" style="margin-left:6px">Entropy:</span><span class="bsv" id="sOut">0</span>
  <span class="bst" style="margin-left:6px">Agents:</span><span class="bsv" id="agOut">0</span>
  <div style="flex:1"></div>
  <span style="font-size:9px;color:var(--sub)" id="modeLabel">Create Mode</span>
</div>
</div>

<script>
// ── SIMULATION STATE ──────────────────────────────────────────────────────
const W=36,H=28,D=1,SZ=W*H,NF=12;
const FE=0,FD=1,FI=2,FS=3,FT=4,FFX=5,FFY=6,FTau=8,FCid=9,FBio=10,FProc=11;
let buf=new Float32Array(SZ*NF),bbuf=new Float32Array(SZ*NF);
window.W=W;window.H=H;window.D=D;window.NF=NF;window.buf=buf;
let causal=[],tick=0,playing=false,layer=0;
let selX=-1,selY=-1,painting=false,tool='paint';
let lastTs=0,fps=0,fc=0,fpt=0;
let activeProcs=new Set(['thermo','bio']);
let activeBrush=null;
let histE=[],histT=[],histI=[],histS=[],histB=[];
let currentAppMode='create',currentPanel='world',currentRenderMode='3d';

// Physics constants (adjustable by laws & composer)
let DIFFUSION=0.09,ENTROPY_BASE=0.0004,INFO_RATE=0.35,BIO_THRESH=0.25;

const canvas=document.getElementById('gc');
const ctx=canvas.getContext('2d');
const hc=document.getElementById('hc');
const hx=hc.getContext('2d');
const wrap=document.getElementById('viewWrap');

function idx(x,y){return(y*W+x)*NF}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function get(x,y,f){if(x<0||x>=W||y<0||y>=H)return 0;return buf[idx(x,y)+f]}
function set_(x,y,f,v){if(x<0||x>=W||y<0||y>=H)return;buf[idx(x,y)+f]=clamp(v,-9999,9999)}
function add_(x,y,f,v){if(x<0||x>=W||y<0||y>=H)return;buf[idx(x,y)+f]=clamp(buf[idx(x,y)+f]+v,-9999,9999)}

function resize(){canvas.width=wrap.clientWidth;canvas.height=wrap.clientHeight;}
new ResizeObserver(resize).observe(wrap);resize();

// ── COLOR MAP ─────────────────────────────────────────────────────────────
function colorOf(l,t){
  t=clamp(t,0,1);
  if(l===0){if(t<.15)return[0,0,Math.round(t/.15*180)];if(t<.4){const s=(t-.15)/.25;return[0,Math.round(s*180),Math.round(180-s*180)]}if(t<.7){const s=(t-.4)/.3;return[Math.round(s*255),Math.round(180-s*60),0]}const s=(t-.7)/.3;return[255,Math.round(120+s*135),Math.round(s*255)]}
  if(l===1)return t<.4?[0,Math.round(t/.4*80),20]:[Math.round((t-.4)/.6*200),Math.round(80+(t-.4)/.6*120),20];
  if(l===2)return t<.3?[Math.round(t/.3*60),0,Math.round(t/.3*80)]:[Math.round(60+(t-.3)/.7*190),Math.round((t-.3)/.7*160),Math.round(80+(t-.3)/.7*160)];
  if(l===3)return[Math.round(t*220),Math.round(t*40),40];
  if(l===4)return t<.5?[Math.round(t*2*255),0,Math.round((1-t*2)*200)]:[255,Math.round((t-.5)/.5*200),0];
  if(l===5)return[Math.round(t*40),Math.round(t*210),Math.round(t*80)];
  return[80,80,80];
}

function drawGrid(){
  const cw=canvas.width,ch=canvas.height;
  ctx.fillStyle='#07070e';ctx.fillRect(0,0,cw,ch);
  const cs=Math.min(cw/W,ch/H);
  const ox=(cw-cs*W)/2,oy=(ch-cs*H)/2;
  const fi=[FE,FD,FI,FS,FT,FBio][layer]??FE;
  const mx=[1000,1,500,1,800,1][layer]??1000;
  const id=ctx.createImageData(cw,ch);const d=id.data;
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    const v=buf[idx(x,y)+fi]; if(v<0.5) continue;
    const t=Math.min(v/mx,1); const[r,g,b]=colorOf(layer,t);
    const px=Math.floor(ox+x*cs),py=Math.floor(oy+y*cs);
    const pw=Math.max(1,Math.floor(cs)-1),ph=Math.max(1,Math.floor(cs)-1);
    for(let dy=0;dy<ph;dy++)for(let dx=0;dx<pw;dx++){
      const pi=(py+dy)*cw+(px+dx);d[pi*4]=r;d[pi*4+1]=g;d[pi*4+2]=b;d[pi*4+3]=255;
    }
    if(x===selX&&y===selY){
      for(let dx=0;dx<pw;dx++){const pi=py*cw+px+dx;d[pi*4]=d[pi*4+1]=d[pi*4+2]=255;if(py+ph-1>=0){const pi2=(py+ph-1)*cw+px+dx;d[pi2*4]=d[pi2*4+1]=d[pi2*4+2]=255;}}
      for(let dy=0;dy<ph;dy++){const pi=(py+dy)*cw+px;d[pi*4]=d[pi*4+1]=d[pi*4+2]=255;if(px+pw-1<cw){const pi2=(py+dy)*cw+px+pw-1;d[pi2*4]=d[pi2*4+1]=d[pi2*4+2]=255;}}
    }
  }
  ctx.putImageData(id,0,0);
}

// ── SIMULATION ────────────────────────────────────────────────────────────
function simStep(dt){
  bbuf.set(buf);
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    const ns=[[x-1,y],[x+1,y],[x,y-1],[x,y+1]].filter(([nx,ny])=>nx>=0&&nx<W&&ny>=0&&ny<H);
    const nc=ns.length;
    let lapE=0,lapD=0,lapT=0,lapI=0;
    for(const[nx,ny]of ns){lapE+=bbuf[idx(nx,ny)+FE];lapD+=bbuf[idx(nx,ny)+FD];lapT+=bbuf[idx(nx,ny)+FT];lapI+=bbuf[idx(nx,ny)+FI];}
    lapE-=nc*bbuf[idx(x,y)+FE];lapD-=nc*bbuf[idx(x,y)+FD];lapT-=nc*bbuf[idx(x,y)+FT];lapI-=nc*bbuf[idx(x,y)+FI];
    set_(x,y,FE,clamp(bbuf[idx(x,y)+FE]+DIFFUSION*lapE*dt,0,9999));
    if(activeProcs.has('thermo')){
      set_(x,y,FT,clamp(bbuf[idx(x,y)+FT]+0.07*lapT*dt+get(x,y,FE)*0.002*dt,0,2000));
      set_(x,y,FD,clamp(bbuf[idx(x,y)+FD]+0.012*lapD*dt,0,1));
    }
    if(activeProcs.has('info'))set_(x,y,FI,clamp(bbuf[idx(x,y)+FI]+0.04*lapI*dt-get(x,y,FS)*0.2*dt,0,999));
    // Entropy
    const e=get(x,y,FE),t=get(x,y,FT);
    const dS=(ENTROPY_BASE+e*0.00004+t*0.000015)*dt*60;
    set_(x,y,FS,clamp(get(x,y,FS)+dS,0,1));
    add_(x,y,FE,-e*get(x,y,FS)*0.0002*dt*60);
    // Bio
    if(activeProcs.has('bio')){
      const s=get(x,y,FS),sup=clamp(1-s*0.9,0,1);
      if(e>80&&get(x,y,FD)>BIO_THRESH&&sup>0){add_(x,y,FI,INFO_RATE*sup*dt);add_(x,y,FBio,0.015*sup*dt);}
      else{set_(x,y,FI,get(x,y,FI)*Math.pow(0.9985,dt*60));set_(x,y,FBio,get(x,y,FBio)*Math.pow(0.996,dt*60));}
      set_(x,y,FI,clamp(get(x,y,FI),0,999));set_(x,y,FBio,clamp(get(x,y,FBio),0,1));
    }
    set_(x,y,FTau,get(x,y,FTau)+dt*(1+e*0.0008+get(x,y,FS)*0.2));
    // Causality
    if(Math.abs(get(x,y,FE)-bbuf[idx(x,y)+FE])>55){
      causal.push({tick,x,y,delta:Math.round(get(x,y,FE)-bbuf[idx(x,y)+FE])});
      if(causal.length>300)causal.shift();
    }
  }
  tick++;
  if(selX>=0){
    const push=(a,v)=>{a.push(v);if(a.length>120)a.shift()};
    push(histE,get(selX,selY,FE));push(histT,get(selX,selY,FT));
    push(histI,get(selX,selY,FI));push(histS,get(selX,selY,FS)*700);
    push(histB,get(selX,selY,FBio)*700);
  }
}

function generateWorld(){
  const arch=ARCHETYPES[compSel.arch];if(!arch){log('Select a world type first');return;}
  buf.fill(0);causal=[];tick=0;
  const phys=PHYSICS_MOODS[compSel.physics]?.m||{};
  DIFFUSION=(arch.laws.DIFFUSION||0.09)*(phys.DIFFUSION||1);
  ENTROPY_BASE=(arch.laws.ENTROPY_BASE||0.0004)*(phys.ENTROPY_BASE||1);
  INFO_RATE=(arch.laws.INFO_RATE||0.35)*(phys.INFO_RATE||1);
  activeProcs=new Set(arch.procs||[]);
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    const n=(Math.sin(x*0.4+y*0.3)*Math.cos(x*0.3-y*0.5)+1)/2;
    const nz=(Math.sin(x*0.7)*Math.cos(y*0.6)+1)/2;
    set_(x,y,FE,Math.max(0,(n*0.7+nz*0.3)*600+20));
    set_(x,y,FD,Math.max(0,n*0.8));
    set_(x,y,FI,Math.max(0,nz*100));
    set_(x,y,FT,Math.max(0,n*300));
    set_(x,y,FS,0.02+Math.random()*0.05);
  }
  closeComposer();
  if(currentRenderMode==='metrics')setRenderMode('3d',document.getElementById('tab3d'));
  log(`World "${compSel.arch}" generated → ${arch.desc}`);
  playing=true;
  document.getElementById('pb').textContent='⏸ Pause';
  setIconPanel('world');
}

// ── HEALTH PANEL ──────────────────────────────────────────────────────────
function updateHealth(){
  let totE=0,totS=0,totI=0,totB=0;
  for(let i=0;i<SZ;i++){totE+=buf[i*NF+FE];totS+=buf[i*NF+FS];totI+=buf[i*NF+FI];totB+=buf[i*NF+FBio];}
  const avgS=totS/SZ,avgB=totB/SZ,avgI=totI/SZ,avgE=totE/SZ;
  const stab=Math.round((1-avgS)*100);
  const emerg=Math.min(100,Math.round((avgB*50+avgI/10+avgE/20)*(1-avgS)));
  const extRisk=Math.round(Math.max(0,avgS*100-20));
  const BARS=[['Stability',stab,'#6080ff'],['Emergence',emerg,'#40c060'],['Extinction risk',extRisk,'#e04040']];
  document.getElementById('hbars').innerHTML=BARS.map(([l,v,c])=>`
    <div class="hbar">
      <div class="hbar-hdr"><span>${l}</span><span style="color:${c};font-family:monospace">${v}%</span></div>
      <div class="hbar-track"><div class="hbar-fill" style="width:${v}%;background:${c}"></div></div>
    </div>`).join('');
  const semEnt=avgS<0.1?['Frozen','#6080ff']:avgS<0.3?['Ordered','#40c060']:avgS<0.6?['Turbulent','#e09030']:['Chaotic','#e04040'];
  const semBio=avgB<0.05?['Barren','#555']:avgB<0.3?['Sparse','#608060']:avgB<0.7?['Fertile','#40c060']:['Dominant','#20e060'];
  const semE=avgE<20?['Dead','#333']:avgE<200?['Active','#6080ff']:['Volcanic','#ff4020'];
  document.getElementById('semTags').innerHTML=[semEnt,semBio,semE].map(([l,c])=>`
    <span class="sem-tag" style="background:${c}22;color:${c};border-color:${c}55">${l}</span>`).join('');
  const alerts=[];
  if(avgS>0.7)alerts.push(['critical','Entropy Critical — order collapsing']);
  if(avgB<0.05&&tick>200)alerts.push(['warn','Life Collapse Risk']);
  if(avgI>200)alerts.push(['info','Information Saturation']);
  if(avgE<10&&tick>100)alerts.push(['warn','Energy Depletion']);
  if(avgB>0.4&&avgI>100)alerts.push(['ok','Complexity ↑ — Emergence detected']);
  document.getElementById('alerts').innerHTML=alerts.map(([t,m])=>`<div class="alert alert-${t}">${m}</div>`).join('');
}

function explainCell(x,y){
  const E=get(x,y,FE),D_=get(x,y,FD),I=get(x,y,FI),S=get(x,y,FS),T=get(x,y,FT),B=get(x,y,FBio);
  const cards=[];
  cards.push({field:'⚡ Energy',val:E.toFixed(1),why:E>500?'Very high — major source, diffusing to neighbors.':E>100?'Moderate. Stable diffusion in progress.':E<10?'Near-zero. Consumed or diffused away.':'Low but present.'});
  if(T>0.1)cards.push({field:'🌡️ Temp',val:T.toFixed(0),why:T>500?'Plasma-level — entropy rising fast.':T>200?'Very hot. Energy coupling strong.':T<20?'Near-freezing. Ice-like order possible.':'Moderate temperature.'});
  const causes=[];if(E>200)causes.push('high energy');if(T>300)causes.push('thermal');
  cards.push({field:'🔥 Entropy',val:S.toFixed(3),why:S>0.6?`Critical${causes.length?' from '+causes.join('+')+' input':' from baseline'}. Structures decaying.`:S>0.3?'Elevated. Order eroding.':S<0.1?'Very low — ordered state. Crystal or ice possible.':'Normal disorder level.'});
  if(I>5||E>80)cards.push({field:'🧠 Info',val:I.toFixed(0),why:I>300?'Self-sustaining complexity.':I>50&&E>80&&D_>0.2?'Growing — energy+density threshold met.':I<5?'Suppressed by entropy.':'Low information density.'});
  cards.push({field:'🧬 Bio',val:B.toFixed(3),why:B>0.7?'High — multiple life conditions met.':B>0.3?'Moderate — partial conditions. Needs more energy or info.':'Low — entropy or energy imbalance.'});
  document.getElementById('inspector').innerHTML=`<div style="font-size:9px;color:var(--sub);margin-bottom:6px">Cell (${x},${y}) — why these values?</div>`+cards.map(c=>`<div class="excard"><div class="excard-hdr"><span class="excard-field">${c.field}</span><span class="excard-val">${c.val}</span></div><div class="excard-why">${c.why}</div></div>`).join('');
}

function drawHist(){
  const w=hc.width=hc.offsetWidth||200,h=70;
  hx.fillStyle='#07070e';hx.fillRect(0,0,w,h);
  const all=[...histE,...histT,...histI,...histS,...histB];
  if(all.length<2)return;
  const mx=Math.max(...all,1);
  const draw=(a,col)=>{if(a.length<2)return;hx.beginPath();hx.strokeStyle=col;hx.lineWidth=1.2;a.forEach((v,i)=>{const px=i/(a.length-1)*w,py=h-(v/mx)*(h-3)-2;i===0?hx.moveTo(px,py):hx.lineTo(px,py);});hx.stroke();};
  draw(histE,'#6080ff');draw(histT,'#ef8030');draw(histI,'#a060e0');draw(histS,'#e04040');draw(histB,'#30a060');
}

// ── CANVAS INTERACTION ────────────────────────────────────────────────────
function getCellAt(e){
  const r=canvas.getBoundingClientRect();
  const cx=(e.clientX-r.left)*(canvas.width/r.width);
  const cy=(e.clientY-r.top)*(canvas.height/r.height);
  const cs=Math.min(canvas.width/W,canvas.height/H);
  const ox=(canvas.width-cs*W)/2,oy=(canvas.height-cs*H)/2;
  const x=Math.floor((cx-ox)/cs),y=Math.floor((cy-oy)/cs);
  if(x<0||x>=W||y<0||y>=H)return null;return{x,y};
}
function paintAt(x,y){
  const bs=parseInt(document.getElementById('bsize')?.value||2);
  const str=parseInt(document.getElementById('bstr')?.value||400);
  if(tool==='stamp_prefab'&&window.gamedevMode){window.gamedevMode.stampAt(x,y);return;}
  if(activeBrush&&BRUSHES[activeBrush]){BRUSHES[activeBrush].paint(x,y,bs+1);return;}
  const fi=[FE,FD,FI,FS,FT,FBio][layer]??FE;
  const mx=[9999,1,999,1,2000,1][layer]??9999;
  for(let dy=-bs;dy<=bs;dy++)for(let dx=-bs;dx<=bs;dx++){
    const nx=x+dx,ny=y+dy;if(nx<0||nx>=W||ny<0||ny>=H||dx*dx+dy*dy>bs*bs)continue;
    if(tool==='erase'){[FE,FD,FI,FS,FT,FBio].forEach(f=>set_(nx,ny,f,0));}
    else if(tool==='inject')add_(nx,ny,fi,str);
    else if(tool==='paint')set_(nx,ny,fi,clamp(str,0,mx));
  }
}
canvas.addEventListener('pointerdown',e=>{
  const c=getCellAt(e);if(!c)return;
  painting=true;canvas.setPointerCapture(e.pointerId);
  if(tool==='inspect'){selX=c.x;selY=c.y;histE=[];histT=[];histI=[];histS=[];histB=[];explainCell(c.x,c.y);}
  else paintAt(c.x,c.y);
});
canvas.addEventListener('pointermove',e=>{
  if(!painting)return;const c=getCellAt(e);if(!c)return;
  if(tool==='inspect'){selX=c.x;selY=c.y;}else paintAt(c.x,c.y);
});
canvas.addEventListener('pointerup',()=>{painting=false;});

// ── PRESETS ───────────────────────────────────────────────────────────────
window.applyPreset=function(p){
  buf.fill(0);causal=[];tick=0;
  const cx=W/2,cy=H/2;
  if(p==='burst'){for(let y=0;y<H;y++)for(let x=0;x<W;x++){const d=Math.sqrt((x-cx)**2+(y-cy)**2);if(d<8){const g=Math.exp(-d*d/20);set_(x,y,FE,900*g);set_(x,y,FT,400*g);set_(x,y,FD,0.7*g);}}}
  else if(p==='wave'){for(let y=0;y<H;y++)for(let x=0;x<W;x++){set_(x,y,FE,400+400*Math.sin(x*.7)*Math.cos(y*.5));set_(x,y,FD,.4+.3*Math.sin(x*.3+y*.3));set_(x,y,FT,150+100*Math.cos(x*.4));}}
  else if(p==='life'){for(let i=0;i<25;i++){const x=4+Math.floor(Math.random()*(W-8)),y=4+Math.floor(Math.random()*(H-8));const e=150+Math.random()*500;set_(x,y,FE,e);set_(x,y,FD,.3+Math.random()*.5);set_(x,y,FI,e*.3);set_(x,y,FT,80+Math.random()*180);set_(x,y,FBio,.2+Math.random()*.5);}}
  else if(p==='proto'){for(let y=0;y<H;y++)for(let x=0;x<W;x++){const n=(Math.sin(x*.4)*Math.cos(y*.3)+1)/2;set_(x,y,FE,50+n*400);set_(x,y,FD,.2+n*.6);set_(x,y,FT,30+n*250);set_(x,y,FS,0.05+Math.random()*.1);if(n>.6){set_(x,y,FBio,n*.4);set_(x,y,FI,n*80);}}}
  else if(p==='storm'){for(let y=0;y<H;y++)for(let x=0;x<W;x++){set_(x,y,FE,Math.random()*700);set_(x,y,FS,.2+Math.random()*.7);set_(x,y,FT,Math.random()*350);set_(x,y,FD,Math.random()*.8);}}
  else if(p==='ruins'){for(let y=0;y<H;y++)for(let x=0;x<W;x++){const n=(Math.sin(x*.5)*Math.cos(y*.4)+1)/2;if(n>.5){set_(x,y,FE,50+n*150);set_(x,y,FI,n*300);set_(x,y,FD,.3+n*.3);set_(x,y,FS,.2+Math.random()*.4);}}}
  else if(p==='clear'){buf.fill(0);}
  log(`Preset: ${p}`);
};

// ── UI HELPERS ────────────────────────────────────────────────────────────
function setIconPanel(id){
  currentPanel=id;
  document.querySelectorAll('.icon-btn[data-panel]').forEach(b=>b.classList.toggle('active',b.dataset.panel===id));
  document.getElementById('left').innerHTML=PANELS[id]?.()||'';

}
window.setIconPanel=setIconPanel;

function setRenderMode(mode,btn){
  currentRenderMode=mode;
  document.querySelectorAll('#tabs .ctab').forEach(t=>t.classList.remove('on'));
  if(btn)btn.classList.add('on');
  const gc=document.getElementById('gc');
  const mv=document.getElementById('metricsView');

  if(mv)mv.style.display=mode==='metrics'?'block':'none';

}
window.setRenderMode=setRenderMode;

function previewRenderMode(mode){
  const idMap={'3d':'tab3d','2d':'tab2d','hybrid':'tabHybrid','metrics':'tabMetrics'};
  setRenderMode(mode,document.getElementById(idMap[mode]));
}
window.previewRenderMode=previewRenderMode;

function updateMetricsView(){
  const mv=document.getElementById('metricsContent');if(!mv)return;
  let totE=0,totS=0,totI=0,totB=0,totI2=0;
  for(let i=0;i<SZ;i++){totE+=buf[i*NF+FE];totS+=buf[i*NF+FS];totI2+=buf[i*NF+FI];totB+=buf[i*NF+FBio];}
  const rows=[
    ['Tick',tick],['Avg Energy',(totE/SZ).toFixed(2)],['Avg Entropy',(totS/SZ).toFixed(5)],
    ['Avg Info',(totI2/SZ).toFixed(2)],['Avg Bio',(totB/SZ).toFixed(5)],
    ['Active Laws',LAWS.filter(l=>l.active).length+'/'+LAWS.length],
    ['Causal Events',causal.length],['Diffusion',DIFFUSION.toFixed(4)],
    ['Entropy Base',ENTROPY_BASE.toFixed(6)],['Info Rate',INFO_RATE.toFixed(3)],
  ];
  mv.innerHTML=rows.map(([k,v])=>`<div style="display:flex;justify-content:space-between;padding:3px 0;border-bottom:0.5px solid #1a1a25"><span>${k}</span><span style="color:var(--text)">${v}</span></div>`).join('');
}

window.toggleSection=toggleSection;

function setLayer(l){

  ['layerE','layerD','layerI','layerS','layerT','layerB'].forEach((id,i)=>{
    const el=document.getElementById(id);if(el)el.classList.toggle('active',i===l);
  });
}
window.setLayer=setLayer;

function setTool(t,btn){

  activeBrush=null;
  document.querySelectorAll('#toolPills .pill').forEach(p=>p.classList.remove('on'));

window.setTool=setTool;

function toggleProc(id){
  if(activeProcs.has(id))activeProcs.delete(id);else activeProcs.add(id);

window.setPill=setPill;

function setMoodPill(type,btn,val){
  btn.closest('.pill-row').querySelectorAll('.pill').forEach(p=>p.classList.remove('on'));
  btn.classList.add('on');
  const MAPS={
    stability:{Fragile:{ENTROPY_BASE:0.002},Dynamic:{ENTROPY_BASE:0.0006},Balanced:{ENTROPY_BASE:0.0004},'Self-Repairing':{ENTROPY_BASE:0.0001}},
    entropy:{'Low (Order)':{ENTROPY_BASE:0.00005},Medium:{ENTROPY_BASE:0.0004},'High (Chaos)':{ENTROPY_BASE:0.001},Extreme:{ENTROPY_BASE:0.003}},
    life:{Suppressed:{INFO_RATE:0.05},Neutral:{INFO_RATE:0.35},Fertile:{INFO_RATE:0.8},Aggressive:{INFO_RATE:2.0}},
  };
  const m=MAPS[type]?.[val]||{};
  if(m.ENTROPY_BASE!==undefined)ENTROPY_BASE=m.ENTROPY_BASE;
  if(m.INFO_RATE!==undefined)INFO_RATE=m.INFO_RATE;
  log(`${type}: ${val}`);
}
window.setMoodPill=setMoodPill;

}

// Script engine
const TEMPLATES={
  ocean:`// Primordial ocean\nfor(let y=0;y<H;y++)for(let x=0;x<W;x++){\n  const d=(Math.sin(x*.4)*Math.cos(y*.3)+1)/2;\n  set_(x,y,0,30+d*80);\n  set_(x,y,1,0.5+d*.3);\n  set_(x,y,4,60+d*40);\n  set_(x,y,2,d*50);\n}`,
  volcano:`// Volcano\nconst cx=W/2,cy=H/2;\nfor(let y=0;y<H;y++)for(let x=0;x<W;x++){\n  const d=Math.sqrt((x-cx)**2+(y-cy)**2);\n  const g=Math.exp(-d*d/40);\n  set_(x,y,0,g*900);\n  set_(x,y,4,g*600);\n  set_(x,y,1,g*.8);\n}`,
  life:`// Life explosion\nfor(let i=0;i<20;i++){\n  const x=4+Math.floor(Math.random()*(W-8));\n  const y=4+Math.floor(Math.random()*(H-8));\n  set_(x,y,0,200+Math.random()*400);\n  set_(x,y,1,.4+Math.random()*.4);\n  set_(x,y,2,100+Math.random()*200);\n  set_(x,y,10,.4+Math.random()*.4);\n}`,
  galaxy:`// Galaxy spiral\nconst cx=W/2,cy=H/2;\nfor(let y=0;y<H;y++)for(let x=0;x<W;x++){\n  const dx=x-cx,dy=y-cy;\n  const r=Math.sqrt(dx*dx+dy*dy);\n  const a=Math.atan2(dy,dx);\n  const s=Math.sin(a*2-r*.5);\n  if(s>.3&&r>2&&r<W/2-2){\n    set_(x,y,0,s*600);\n    set_(x,y,1,s*.6);\n  }\n}`,
};
window.loadTemplate=function(){const v=document.getElementById('tmplSel')?.value;if(v&&TEMPLATES[v])document.getElementById('scriptArea').value=TEMPLATES[v];};
window.runScript=function(){
  const code=document.getElementById('scriptArea')?.value;if(!code)return;
  try{
    const fn=new Function('buf','W','H','NF','SZ','set_','add_','get','Math',code);
    fn(buf,W,H,NF,SZ,set_,add_,get,Math);
    document.getElementById('scriptLog').textContent='✓ Script executed';
    log('Script ran OK');
  }catch(e){document.getElementById('scriptLog').textContent='Error: '+e.message;log('Script error: '+e.message);}
};
window.spawnAgents=function(n){log(`Spawned ${n} agents (visual only in this build)`);};
window.saveWorld=function(){
  const cells=[];
  for(let i=0;i<SZ;i++){const base=i*NF;let any=false;for(let f=0;f<NF;f++)if(Math.abs(buf[base+f])>0.01){any=true;break;}if(any)cells.push({i,d:Array.from(buf.subarray(base,base+NF))});}
  const json=JSON.stringify({format:'re_v5',W,H,NF,tick,cells});
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([json],{type:'application/json'}));a.download=`re_world_t${tick}.reality`;a.click();
  log('Saved .reality file');
};

function log(msg){document.getElementById('plog').textContent=msg;}
window.openComposer=openComposer;
window.closeComposer=closeComposer;
window.saveWorld=window.saveWorld;

// ── MAIN LOOP ─────────────────────────────────────────────────────────────
function loop(ts){
  requestAnimationFrame(loop);
  const spd=parseInt(document.getElementById('spd')?.value||4);
  const dt=Math.min((ts-lastTs)/1000,.05);lastTs=ts;
  fc++;if(ts-fpt>600){fps=Math.round(fc*1000/(ts-fpt));fc=0;fpt=ts;}
  if(playing)for(let s=0;s<spd;s++)simStep(0.016);
  drawGrid();
  if(tick%3===0&&selX>=0){explainCell(selX,selY);drawHist();}
  if(tick%15===0)updateHealth();
  if(tick%5===0&&currentAppMode==='science'&&window.scienceMode)window.scienceMode.onTick(tick,buf,W,H,NF);
  if(currentAppMode==='cinema'&&window.cinemaMode)window.cinemaMode.onTick(tick,buf);
  if(currentAppMode==='game'&&window.gamedevMode)window.gamedevMode.onTick(tick,buf);
  let totE=0,totS=0;for(let i=0;i<SZ;i++){totE+=buf[i*NF+FE];totS+=buf[i*NF+FS];}
  window.tick=tick;
  document.getElementById('tkOut').textContent=tick;
  document.getElementById('eOut').textContent=Math.round(totE).toLocaleString();
  document.getElementById('sOut').textContent=(totS/SZ).toFixed(4);
  document.getElementById('agOut').textContent=0;
  document.getElementById('fpsOut').textContent=fps;
}

// Init
setIconPanel('world');
setLayer(0);
document.getElementById('layerE')?.classList.add('active');
applyPreset('proto');
updateHealth();
requestAnimationFrame(ts=>{lastTs=ts;fpt=ts;requestAnimationFrame(loop);});
</script>
