name: Dependency Security Audit

on:
  pull_request:
    branches:
      - infinity-scale-real-diagnostics
    paths:
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/dependency-security-audit.yml"
  push:
    branches:
      - codex/dependency-audit-report-current-base-2026-10-18
    paths:
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/dependency-security-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: npm audit (moderate and above)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run npm audit and retain exit code
        id: audit
        shell: bash
        run: |
          set +e
          npm audit --audit-level=moderate --json > npm-audit.json
          audit_exit_code=$?
          set -e
          echo "exit_code=$audit_exit_code" >> "$GITHUB_OUTPUT"

      - name: Summarize audit report
        if: always()
        shell: bash
        run: |
          node --input-type=commonjs <<'NODE'
          const fs = require('node:fs');
          const reportPath = 'npm-audit.json';
          let report;
          try {
            report = JSON.parse(fs.readFileSync(reportPath, 'utf8'));
          } catch (error) {
            const summary = { reportValid: false, error: String(error) };
            fs.writeFileSync('npm-audit-summary.json', JSON.stringify(summary, null, 2) + '\n');
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, '## Dependency security audit\n\n**ERROR:** npm audit did not produce valid JSON.\n');
            process.exit(0);
          }

          const v = report.metadata?.vulnerabilities ?? {};
          const summary = {
            reportValid: true,
            auditReportVersion: report.auditReportVersion ?? null,
            vulnerabilities: {
              critical: Number(v.critical ?? 0),
              high: Number(v.high ?? 0),
              moderate: Number(v.moderate ?? 0),
              low: Number(v.low ?? 0),
              info: Number(v.info ?? 0),
              total: Number(v.total ?? 0),
            },
            packagesWithFindings: Object.entries(report.vulnerabilities ?? {}).map(([name, item]) => ({
              name,
              severity: item.severity,
              isDirect: item.isDirect,
              range: item.range,
              fixAvailable: item.fixAvailable,
              via: (item.via ?? []).map(entry => typeof entry === 'string' ? entry : ({
                title: entry.title,
                url: entry.url,
                severity: entry.severity,
                range: entry.range,
              })),
            })),
          };
          fs.writeFileSync('npm-audit-summary.json', JSON.stringify(summary, null, 2) + '\n');
          const lines = [
            '## Dependency security audit',
            '',
            '| Severity | Count |',
            '|---|---:|',
            '| Critical | ' + summary.vulnerabilities.critical + ' |',
            '| High | ' + summary.vulnerabilities.high + ' |',
            '| Moderate | ' + summary.vulnerabilities.moderate + ' |',
            '| Low | ' + summary.vulnerabilities.low + ' |',
            '| Info | ' + summary.vulnerabilities.info + ' |',
            '| **Total** | **' + summary.vulnerabilities.total + ' |',
            '',
            'Package-level details are available in the `npm-audit-report` artifact.',
          ];
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join('\n') + '\n');
          console.log(JSON.stringify(summary, null, 2));
          NODE

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-report
          path: |
            npm-audit.json
            npm-audit-summary.json
          if-no-files-found: warn
          retention-days: 14

      - name: Enforce moderate-and-above audit threshold
        if: always()
        shell: bash
        env:
          AUDIT_EXIT_CODE: ${{ steps.audit.outputs.exit_code }}
        run: |
          if [ -z "$AUDIT_EXIT_CODE" ]; then
            echo "npm audit did not produce an exit code."
            exit 2
          fi
          if [ "$AUDIT_EXIT_CODE" -ne 0 ]; then
            echo "npm audit reported moderate-or-higher findings or could not complete."
            exit "$AUDIT_EXIT_CODE"
          fi
